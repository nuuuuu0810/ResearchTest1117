<!-- title: 既存ECサイトのフローを可視化 -->
<style>
.g3{display:grid;grid-template-columns:340px 1fr 372px;height:711px}
.lc{display:flex;justify-content:center;padding-top:14px;border-right:1px solid var(--line);background:#fff}
.cc{padding:14px 26px;overflow:hidden}
.rc{padding:14px 18px;border-left:1px solid var(--line);background:#fff;display:flex;flex-direction:column;gap:12px}
.flow{display:flex;flex-direction:column;gap:0}
.fr{display:grid;grid-template-columns:28px 260px 1fr;align-items:center;gap:12px}
.fr .no{width:26px;height:26px;border-radius:50%;background:#e9ecf1;color:#344054;font-size:12px;font-weight:800;display:flex;align-items:center;justify-content:center}
.fr.act .no{background:#111;color:#fff}
.fr.okd .no{background:var(--ok);color:#fff}
.fr .slot,.fr .fnode{min-height:42px}
.fr .slot .piece{min-height:40px}
.fr .dsc{font-size:12px}
.fa{margin-left:40px;width:260px;text-align:center;color:#b3bac5;font-size:11px;line-height:12px;height:13px}
.rc .pool{gap:8px}.rc .piece{width:calc(50% - 4px)}
.legend{font-size:12px;color:var(--sub);line-height:1.7;background:#f8f9fb;border-radius:10px;padding:10px 12px}
</style>
<div class="g3">
  <div class="lc" id="mock"></div>
  <div class="cc"><div class="ptitle">いまのECサイトでの買い物の流れ（業務フロー）</div><div class="flow" id="flow"></div></div>
  <div class="rc"><span class="tag" style="align-self:flex-start">選択肢</span><div class="pool" id="pool"></div>
    <div class="legend">🖐 カードを点線の枠へドラッグ（またはクリックで選んで枠をクリック）。<br>「答え合わせ」で、左のスマホが流れどおりに動くよ。途中で止まったら、そこが間違いのサイン！<br>スマホ下の ‹ › で画面を行き来できるよ。</div></div>
</div>
<script>
const FL=[
 ['websearch','Webで検索する','🔎','検索サイトで「ショッピング」と調べる',0],
 ['opentop','サイトを開く','🌐','検索結果から、お店のトップページを開く',1],
 ['search','商品を検索する','🔍','検索窓に「くだもの」と入力して探す',1],
 ['select','商品を選ぶ','👆','一覧から気になる商品をタップする',0],
 ['qty','個数を選ぶ','🔢','＋ボタンで買いたい数を指定する',1],
 ['add','カートに入れる','🛒','選んだ商品と個数をカートに追加する',1],
 ['opencart','カートを開く','🧺','カートのアイコンから中身を確認する',0],
 ['total','合計金額を確かめる','💴','商品ごとの金額と合計を確認する',1],
 ['pay','決済する','💳','届け先と支払い方法を入力して注文を確定',1],
 ['backtop','トップに戻る','🏠','注文完了後、トップページへ戻る',0]];
const HINTS={opentop:'検索結果の次は…？ まずはお店のサイトそのものを“開く”必要があるね。',search:'トップページから、果物を探すために何をする？ 検索窓を使うよ。',
 qty:'商品を選んだあと、カートに入れる前に決めることは？ ブドウを2房ほしいときは…',add:'個数を決めたら、その商品をどこに入れておく？',
 total:'カートの中で、払う金額を確かめるよ。',pay:'合計を確かめたら、届け先と支払いを入力して…'};
const flow=$('#flow');const pieces={};
FL.forEach(([k,n,e,d,s],i)=>{
  flow.appendChild(h(`<div class="fr" data-i="${i}"><span class="no">${i+1}</span>${s?`<div class="slot" data-accept="${k}" data-hint="${HINTS[k]}"><span class="ph">？</span></div>`:`<div class="fnode fixed"><span class="ic">${e}</span>${n}</div>`}<span class="dsc">${d}</span></div>`));
  if(i<FL.length-1)flow.appendChild(h('<div class="fa">▼</div>'));if(s)pieces[k]={label:n,icon:e}});
Object.assign(pieces,{x1:{label:'店舗に電話する',icon:'📞'},x2:{label:'レジに並ぶ',icon:'🧾'},x3:{label:'商品を手に取る',icon:'🤲'},x4:{label:'チラシを見る',icon:'📰'}});
const P=new Puzzle({pieces,pool:$('#pool')});
const M=new Mock($('#mock'));M.go('home');

Page.init({id:'02',stage:'plan',title:'既存ECサイトのフローを可視化',
 mission:'いまのECサイトで、お客さんが商品を買うまでの流れを図にしよう',
 intro:'ふだん使っているECサイトを思い出してみよう。お客さんの操作を順番どおりに並べると「業務フロー」になるよ。',
 hints:['1つの枠には、その行の右側に書いてある「画面でやること」に合うカードが入るよ。','「電話」「レジ」「チラシ」はお店に行って買うときの行動。ECサイトの流れには入らないね。'],
 async onCheck(){
   const r=P.check();const bad=new Set([...r.wrong,...r.empty]);Lines.clear();
   M.S.cart=[];M.hist=[];M.hi=-1;
   const rows=$$('.fr');rows.forEach(x=>x.classList.remove('okd','act'));
   for(let i=0;i<FL.length;i++){const row=rows[i],node=$('.slot,.fnode',row);
     rows.forEach(x=>x.classList.remove('act'));row.classList.add('act');node.classList.add('act');Lines.clear();Lines.link(node,$('.phone'));
     if(bad.has(node)){M.unhl();M.badge('🤔 次に何をすればいいかわからない…<br><small>フローが途中で途切れてしまった</small>',{cls:'ng',top:160});
       node.classList.remove('act');Eng.point(node,P.get(node)?node.dataset.hint:'ここが空いているよ。'+node.dataset.hint);setTimeout(()=>{M.clearBadges();Lines.clear()},3500);return false}
     M.clearBadges();await M.step(FL[i][0]);if(FL[i][0]==='pay')await M.step('confirm');
     node.classList.remove('act');row.classList.remove('act');row.classList.add('okd');if(node.classList.contains('slot'))node.classList.add('ok')}
   Lines.clear();M.hideFinger();P.lock();return true},
 doneMsg:'流れがつながった！ 業務フローを描くと、お客さんがどの画面で何をするかがはっきりするね。スマホ下の ‹ › でもう一度確かめられるよ。'});
</script>
