<!-- title: TCP/IP -->
<style>
.g2{display:grid;grid-template-columns:320px 1fr;height:711px}
.mk{display:flex;justify-content:center;padding-top:14px;border-right:1px solid var(--line);background:#fff}
.rt{padding:14px 20px;display:flex;flex-direction:column;gap:12px}
.wire{position:relative;height:150px;background:#fff;border:1px solid var(--line);border-radius:14px}
.wire .end{position:absolute;top:28px;width:120px;text-align:center;font-weight:800;font-size:12px}
.wire .end .ic{font-size:40px;display:block}
.wire .ln{position:absolute;left:150px;right:150px;top:60px;height:3px;background:repeating-linear-gradient(90deg,#2b2f36 0 10px,transparent 10px 16px)}
.wire .wf{position:absolute;left:calc(50% - 30px);top:34px;font-size:40px}
.pkt{position:absolute;left:150px;top:92px;display:flex;align-items:stretch;border-radius:8px;overflow:hidden;font-size:11px;font-weight:800;box-shadow:0 4px 12px rgba(0,0,0,.15);transition:left 1.4s ease-in-out}
.pkt span{padding:6px 9px;color:#fff;display:flex;align-items:center;white-space:nowrap}
.L4{background:#7a5af8}.L3{background:#0a66d1}.L2{background:#0e9384}.L1{background:#e2620c}.D{background:#111}
.risk{display:flex;gap:14px;align-items:center;padding:14px 16px}
.risk .ic{font-size:30px;width:54px;height:54px;border-radius:14px;background:var(--ngbg);display:flex;align-items:center;justify-content:center;flex:none}
.risk .lab{font-size:11px;font-weight:800;color:var(--ng)}
.risk h3{margin:2px 0;font-size:16px}
.risk p{margin:0;font-size:12.5px;color:#344054;line-height:1.6}
.risk .slot{width:300px;min-height:56px;flex:none}
.stack{display:grid;grid-template-columns:1fr 140px 1fr;gap:10px;align-items:start}
.col{display:flex;flex-direction:column;gap:6px}
.col .ttl{font-size:12px;font-weight:800;color:var(--sub);text-align:center}
.ly{border-radius:10px;padding:8px 10px;color:#fff;font-size:12px;font-weight:800;opacity:.15;transition:opacity .4s;min-height:44px}
.ly small{display:block;font-weight:600;font-size:10.5px;opacity:.9}
.ly.on{opacity:1}
.mid{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:11px;color:var(--sub);font-weight:700;height:100%}
.pl{display:flex;gap:10px;align-items:center}
.pl .piece small{display:block;font-weight:500;color:var(--sub);font-size:10.5px}
</style>
<div class="g2">
  <div class="mk" id="mock"></div>
  <div class="rt">
    <div class="wire"><div class="end" style="left:20px"><span class="ic">📱</span>スマホ</div><div class="ln"></div><div class="wf">📶🌐</div><div class="end" style="right:20px"><span class="ic">🖥️</span>Webサーバー</div><div class="pkt" id="pkt"><span class="D">📄 データ</span></div></div>
    <div class="panel risk" id="risk"></div>
    <div class="stack"><div class="col" id="snd"><div class="ttl">送る側（スマホ）▼ 上から順に情報を付ける</div></div><div class="mid">⬇<br>電気・電波<br>の信号で<br>送る<br>➡<br>⬆</div><div class="col" id="rcv"><div class="ttl">受け取る側（サーバー）▲ 下から順に確かめる</div></div></div>
    <div class="pl"><span class="tag">選択肢</span><div class="pool" id="pool"></div></div>
  </div>
</div>
<script>
const LY=[
 {k:'app',c:'L4',n:'アプリケーション層',d:'やってほしいことを指定（HTTP）',r:'指示された処理を行う',tag:'HTTP: このページを見たい',
  risk:'サーバーが、何をしてほしいのかわからない',txt:'データだけ送っても、サーバーは「ページを見せてほしいのか」「注文したいのか」がわからない。',hint:'アプリどうしで「何をしてほしいか」を決まった形で伝える層だよ（Webなら HTTP）。'},
 {k:'tr',c:'L3',n:'トランスポート層',d:'データを分け、届けるアプリと順番を指定（TCP）',r:'順番どおりに戻し、自分のアプリ宛か確認',tag:'TCP: ポート443・番号1/3',
  risk:'大きなデータを、どのアプリに・どの順番で届ければいい？',txt:'写真つきのページは大きい。小さく分けて送るけど、受け取ったときに順番がバラバラだと元に戻せないし、サーバーのどのアプリ宛かもわからない。',hint:'データを分けて番号を付け、届け先のアプリ（ポート番号）を指定する層だよ（TCP）。'},
 {k:'ip',c:'L2',n:'インターネット層',d:'最終目的地を指定（IPアドレス）',r:'最終目的地が自分か確認',tag:'IP: 宛先 203.0.113.5',
  risk:'世界中のコンピュータの中から、どこへ届ければいい？',txt:'インターネットには何億台ものコンピュータがある。最終的な届け先がわからないと、途中のルーターも道を選べない。',hint:'インターネット上の“住所”で、最終目的地を指定する層だよ（IP）。'},
 {k:'nw',c:'L1',n:'ネットワークインターフェース層',d:'次の経由地（Wi-Fi）を指定し、電気・電波の信号にする',r:'信号を0と1に戻し、自分宛か確認',tag:'Wi-Fi: 次はルーターへ 0101…',
  risk:'となりのWi-Fiルーターまで、どうやって送る？',txt:'まずは目の前のWi-Fiルーターに渡さないといけない。でもデータは0と1。このままでは電波にのせられない。',hint:'すぐとなりの機器（次の経由地）を指定して、電気・電波の信号に変える層だよ。'}];
const pieces={};LY.forEach(l=>pieces[l.k]={label:`${l.n}<small>${l.d}</small>`});
pieces.x1={label:'デザイン層<small>画面の色や形を決める</small>'};pieces.x2={label:'じゅうでん層<small>スマホの電池を充電する</small>'};
LY.forEach(l=>{$('#snd').appendChild(h(`<div class="ly ${l.c}" data-k="${l.k}">${l.n}<small>${l.d}</small></div>`))});
[...LY].forEach(l=>{$('#rcv').appendChild(h(`<div class="ly ${l.c}" data-k="${l.k}">${l.n}<small>${l.r}</small></div>`))});
const M=new Mock($('#mock'));M.go('search',{query:'ショッピング'});
let i=0,P=new Puzzle({root:$('#risk'),pool:$('#pool'),pieces});
function showRisk(){const l=LY[i];Page.setStep(i);$('#risk').innerHTML=`<div class="ic">⚠️</div><div style="flex:1"><div class="lab">リスク ${i+1} / 4</div><h3>${l.risk}</h3><p>${l.txt}</p></div><div class="slot" data-accept="${l.k}" data-hint="${l.hint}"><span class="ph">この問題を解決する層</span></div>`;$('#risk .slot').dataset.ph0='<span class="ph">この問題を解決する層</span>';P.lock(false)}
function pkt(){const p=$('#pkt');p.innerHTML=[...LY.slice(0,i)].reverse().map(l=>`<span class="${l.c}">${l.tag}</span>`).join('')+'<span class="D">📄 データ</span>'}
showRisk();
Page.init({id:'21',stage:'des',title:'TCP/IP',steps:4,nextLabel:'ネットワーク構成図へ戻る ▶',
 mission:'スマホとサーバーをただ線でつないだだけでは起きる問題を見つけ、TCP/IPの4つの層で解決しよう',
 intro:'スマホとサーバーを線でつないだだけでは、うまく通信できない…。問題ごとに、それを解決する<b>層（ルールのまとまり）</b>を選ぼう。',
 hints:['層は「何をしてほしいか → どう分けて届けるか → どこへ → となりへどう送るか」の順。','上の層ほどアプリに近く、下の層ほど電気信号に近いよ。'],
 async onCheck(){const l=LY[i];if(!P.judge()){M.badge('⚠ うまく届かない…',{cls:'ng',top:200});setTimeout(()=>M.clearBadges(),1500);return false}
   P.lock(true);$(`#snd [data-k="${l.k}"]`).classList.add('on');i++;pkt();toast(`📦 ${l.tag} を付けた`);await sleep(900);
   if(i<LY.length){showRisk();Eng.say('いいね！ でもまだ問題があるよ。次のリスクを見てみよう。','ok');return false}
   Page.setStep(4);const p=$('#pkt');p.style.left='calc(100% - 520px)';await sleep(1500);
   for(const l of [...LY].reverse()){const e=$(`#rcv [data-k="${l.k}"]`);e.classList.add('on');p.firstElementChild&&p.firstElementChild.remove();await sleep(550)}
   await M.tap('r-shop');await M.go('top');M.hideFinger();return true},
 doneMsg:'4つの層がそろった！ 送る側は上の層から順に情報を付け、受け取る側は下の層から順に確かめて外していく。これが TCP/IP だよ。'});
</script>
