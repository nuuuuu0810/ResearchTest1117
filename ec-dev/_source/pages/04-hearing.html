<!-- title: ステークホルダーへの聞き取り -->
<style>
.g3{display:grid;grid-template-columns:350px 1fr 330px;height:711px}
#chat{background:#f6f7f9;border-right:1px solid var(--line);display:flex;flex-direction:column}
#chat .ch{padding:12px 16px;background:#0b2b3a;color:#fff;font-weight:800;font-size:14px}
#chat .ch small{display:block;font-weight:500;opacity:.8;font-size:11px;margin-top:2px}
#log{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:10px}
.msg{display:flex;gap:8px;align-items:flex-start}
.msg .av{width:34px;height:34px;border-radius:50%;background:#fff;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:20px;flex:none}
.msg .bb{background:#fff;border:1px solid #d9dde3;border-radius:4px 14px 14px 14px;padding:8px 11px;font-size:12.5px;line-height:1.65}
.msg .who{font-size:10px;color:var(--sub);font-weight:800;margin-bottom:2px}
.msg.me{flex-direction:row-reverse}.msg.me .bb{background:#111;color:#fff;border-color:#111;border-radius:14px 4px 14px 14px}
.msg .bb mark{background:#fff3b0;padding:0 2px;border-radius:3px}
.sysm{align-self:center;background:#e3f1e6;border:1px solid #9bc9a5;color:#1e5a2c;border-radius:10px;padding:6px 12px;font-size:11.5px}
.cc{padding:14px 20px;overflow:hidden}
.cols2{display:grid;grid-template-columns:1fr 1fr;gap:28px}
.fcol{display:flex;flex-direction:column;align-items:stretch}
.fcol .fnode{min-height:38px;font-size:12.5px;padding:6px 10px}
.fcol .va{text-align:center;color:#b3bac5;font-size:10px;height:14px;line-height:14px}
.ins{position:relative}
.ins .slot{min-height:44px;border-color:#f08c00;background:#fff8ec}
.ins .slot .ph{color:#c26a00}
.ins::before{content:"＋ 要望から追加";display:block;font-size:10px;font-weight:800;color:#c26a00;margin-bottom:2px}
.rc{padding:14px 16px;border-left:1px solid var(--line);background:#fff;display:flex;flex-direction:column;gap:10px}
.rc .piece{width:100%}
.typing{color:#98a2b3;letter-spacing:2px}
</style>
<div class="g3">
  <div id="chat"><div class="ch">💬 ステークホルダーへの聞き取り<small>店長・店員・お客さんの要望を聞こう</small></div><div id="log"></div></div>
  <div class="cc"><div class="ptitle">既存ECサイトのフロー ＋ 要望から追加する要素</div>
    <div class="cols2"><div class="fcol" id="c1"></div><div class="fcol" id="c2"></div></div></div>
  <div class="rc"><span class="tag" style="align-self:flex-start">選択肢（あると便利な要素）</span><div class="pool" id="pool"></div></div>
</div>
<script>
const N=(e,t)=>`<div class="fnode fixed"><span class="ic">${e}</span>${t}</div>`,V='<div class="va">▼</div>';
const S=(k,hint)=>`<div class="ins"><div class="slot" data-accept="${k}" data-hint="${hint}"><span class="ph">要望に合う要素を追加</span></div></div>`;
$('#c1').innerHTML=[N('🔎','Webで検索する'),V,N('🌐','サイトを開く'),V,N('🔍','商品を検索する'),V,S('sort','店長は「探した商品を、値段の安い順に並べたい」と言っていたね。'),V,N('👆','商品を選ぶ'),V,S('stock','店員さんは「売り切れなのに注文が入る」と困っていたよ。商品ページで何がわかるといい？'),V,N('🔢','個数を選ぶ')].join('');
$('#c2').innerHTML=[N('🛒','カートに入れる'),V,N('🧺','カートを開く'),V,N('💴','合計金額を確かめる'),V,N('💳','決済する'),V,S('mail','お客さんは「注文がちゃんと届いたか不安」と言っていたね。注文直後に何が届くと安心？'),V,N('🏠','トップに戻る'),V,S('track','お客さんは「いつ届くか知りたい」と言っていたよ。注文が終わった“後”で使う要素だね。')].join('');
const P=new Puzzle({pool:$('#pool'),pieces:{
 sort:{label:'安い順などに並び替える',icon:'↕️'},stock:{label:'在庫数を表示する',icon:'📦'},mail:{label:'注文確認メールを送る',icon:'✉️'},track:{label:'配送状況を確認する',icon:'🚚'},
 x1:{label:'毎日すべての商品をメールで送る',icon:'📧'},x2:{label:'画面いっぱいに広告を出す',icon:'📢'},x3:{label:'商品を選んだらすぐ注文を確定する',icon:'⚡'}}});
const WHO={boss:['🧑‍🌾','店長'],staff:['🧑‍🔧','店員（発送担当）'],cust:['🙋','お客さん'],me:['🧑‍💻','あなた']};
async function say(w,t,d=650){const m=h(`<div class="msg ${w==='me'?'me':''}"><div class="av">${WHO[w][0]}</div><div><div class="who">${WHO[w][1]}</div><div class="bb"><span class="typing">• • •</span></div></div></div>`);
  $('#log').appendChild(m);$('#log').scrollTop=1e5;await sleep(d);$('.bb',m).innerHTML=t;$('#log').scrollTop=1e5;await sleep(250)}
const sys=t=>{$('#log').appendChild(h(`<div class="sysm">${t}</div>`));$('#log').scrollTop=1e5};
const REPLY={sort:['boss','うーん、それだと困るんです。<mark>探した商品を並べ替えたい</mark>んですよ。'],stock:['staff','それでは売り切れ問題が解決しないなあ…。<mark>あと何個あるか</mark>がわかるといいんだけど。'],
 mail:['cust','注文した直後に、<mark>ちゃんと注文できたことがわかる連絡</mark>がほしいな。'],track:['cust','注文が終わった後、<mark>荷物が今どこにあるか</mark>見られるとうれしいです。']};
(async()=>{P.lock(true);
 await say('me','今のECサイトの流れを見てもらいました。使ってみて「こうだったらいいな」はありますか？');
 await say('boss','果物の種類が増えてきたので、検索したあと<mark>値段の安い順に並べ替え</mark>られると選びやすいですね。');
 await say('staff','売り切れの商品なのに注文が入って、お断りの連絡が大変なんです。商品のページで<mark>在庫があと何個か</mark>わかるようにしてほしい。');
 await say('cust','注文ボタンを押したあと、本当に注文できたのか不安になります。<mark>確認のメール</mark>がほしいです。');
 await say('cust','それと、注文した果物が<mark>今どこまで来ているか</mark>見られると安心です！');
 sys('📝 要望をもとに、フローに要素を追加しよう');P.lock(false)})();
Page.init({id:'04',stage:'req',title:'ステークホルダーへの聞き取り',
 mission:'店長・店員・お客さんの要望を聞いて、既存のフローに「あると便利な要素」を追加しよう',
 intro:'システムに関わる人（ステークホルダー）の声を聞くのが要件定義の第一歩！ チャットの<b>黄色いところ</b>に注目してね。',
 hints:['チャットの黄色い部分が、追加する要素のヒントだよ。','追加する場所の前後のステップを見ると、どの要望か判断できるよ。','「すぐ注文確定」は便利そうだけど、間違えて注文してしまう原因になるね。'],
 async onCheck(){const r=P.check();
   if(!r.ok){const s=[...r.wrong,...r.empty][0];const k=s.dataset.accept;if(P.get(s))await say(REPLY[k][0],REPLY[k][1],500);P.judge();return false}
   P.judge();P.lock();await say('boss','そうそう、それです！ 私たちの困りごとがちゃんと形になりましたね。',500);sys('✔ 要望を機能の候補として整理できました');return true},
 doneMsg:'聞き取りで「あると便利な要素」が見つかったね。こうした要望が、のちの「必要な機能」になっていくよ。'});
</script>
