<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>バックエンド</title>
<style>
/* ===== 共通スタイル（ビルド時に各ページへインライン化） ===== */
:root{
  --bg:#f6f7f9;--panel:#fff;--line:#e3e6eb;--line2:#d0d5dd;--text:#1b2230;--sub:#667085;--mut:#98a2b3;
  --acc:#0a66d1;--acc2:#e8f1fd;--ok:#12a150;--okbg:#e7f7ee;--ng:#e5383b;--ngbg:#fdecec;--warn:#f08c00;
  --st-plan:#7a5af8;--st-req:#0a66d1;--st-des:#0e9384;--st-dev:#e2620c;--st-test:#dd2590;--st-ops:#16a34a;
  --r:12px;--sh:0 1px 2px rgba(16,24,40,.06),0 2px 8px rgba(16,24,40,.06);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#fff;color:var(--text);
  font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic UI","Meiryo",system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;overflow:hidden;user-select:none;-webkit-user-select:none}
button{font-family:inherit}
#pg{position:relative;width:1440px;height:825px;overflow:hidden;background:var(--bg)}
#hdr{height:54px;display:flex;align-items:center;gap:14px;padding:0 22px;background:#fff;border-bottom:1px solid var(--line)}
#hdr .chip{font-size:12px;font-weight:700;color:#fff;padding:4px 10px;border-radius:20px;letter-spacing:.05em}
#hdr h1{font-size:19px;margin:0;font-weight:800;letter-spacing:.02em}
#hdr .mis{font-size:13px;color:var(--sub);margin-left:6px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#hdr .steps{display:flex;gap:6px;align-items:center;font-size:12px;color:var(--sub);font-weight:700}
#hdr .steps i{width:26px;height:6px;border-radius:4px;background:var(--line);display:block}
#hdr .steps i.on{background:var(--text)}#hdr .steps i.done{background:var(--ok)}
#app{position:relative;height:711px;overflow:hidden}
#ftr{position:absolute;left:0;right:0;bottom:0;height:60px;display:flex;align-items:center;gap:12px;padding:0 22px;background:#fff;border-top:1px solid var(--line);z-index:30}
#ftr .eng-av{width:44px;height:44px;flex:none}
#ftr .eng-msg{flex:1;font-size:13.5px;line-height:1.5;color:#344054;background:#f2f4f7;border-radius:4px 14px 14px 14px;padding:8px 14px;max-width:1000px;position:relative;min-height:36px;display:flex;align-items:center}
#ftr .eng-msg.ng{background:var(--ngbg);color:#912018}
#ftr .eng-msg.ok{background:var(--okbg);color:#05603a}
#ftr .eng-name{font-size:10px;font-weight:800;color:var(--sub);position:absolute;top:-15px;left:2px;background:#fff;padding:0 4px;border-radius:4px}
#ftr .sp{flex:1}
.hintbtn{background:#fff;color:#344054;border:1px solid var(--line2);border-radius:22px;padding:9px 16px;font-size:13px;font-weight:700;cursor:pointer}
.hintbtn:hover{background:#f9fafb}
#checkBtn{background:#111;color:#fff;border:none;border-radius:24px;padding:12px 28px;font-size:15px;font-weight:800;cursor:pointer;display:flex;align-items:center;gap:8px;box-shadow:0 4px 14px rgba(0,0,0,.25);transition:transform .15s,background .2s}
#checkBtn:hover{transform:translateY(-1px)}
#checkBtn:disabled{background:#98a2b3;cursor:default;box-shadow:none;transform:none}
#checkBtn.next{background:#111;animation:pulseBtn 1.6s infinite}
@keyframes pulseBtn{0%,100%{box-shadow:0 0 0 0 rgba(17,17,17,.45)}50%{box-shadow:0 0 0 10px rgba(17,17,17,0)}}

/* ---- パネル ---- */
.panel{background:#fff;border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh)}
.ptitle{font-size:12px;font-weight:800;color:var(--sub);letter-spacing:.08em;display:flex;align-items:center;gap:6px;margin-bottom:8px}
.ptitle::before{content:"";width:4px;height:12px;border-radius:2px;background:var(--text)}
.tag{display:inline-block;font-size:11px;font-weight:800;background:#111;color:#fff;border-radius:12px;padding:3px 10px}
.vdiv{width:1px;background:var(--line);align-self:stretch}

/* ---- パズルのピース / スロット ---- */
.piece{display:flex;align-items:center;gap:8px;background:#fff;border:1.5px solid #c9ced6;border-radius:10px;padding:8px 11px;font-size:13px;font-weight:700;cursor:grab;box-shadow:0 1px 2px rgba(0,0,0,.06);line-height:1.3;transition:opacity .2s,box-shadow .15s,transform .15s;touch-action:none;position:relative}
.piece:hover{box-shadow:0 3px 10px rgba(0,0,0,.12);transform:translateY(-1px)}
.piece .ic{font-size:19px;line-height:1;flex:none}
.piece.used{opacity:.28;pointer-events:none;box-shadow:none}
.piece.sel{outline:3px solid var(--acc);outline-offset:1px}
.piece.ghost{position:fixed;z-index:999;pointer-events:none;opacity:.92;box-shadow:0 12px 28px rgba(0,0,0,.25);transform:rotate(-2deg)}
.piece.sm{padding:5px 9px;font-size:12px}.piece.sm .ic{font-size:15px}
.piece.col{flex-direction:column;justify-content:center;text-align:center;gap:4px;width:118px;min-height:84px;padding:8px 6px;font-size:12px}
.piece.col .ic{font-size:26px}
.pool{display:flex;flex-wrap:wrap;gap:9px;align-content:flex-start}
.slot{min-height:42px;min-width:120px;border:2px dashed #a7b0be;border-radius:11px;background:rgba(249,250,251,.85);display:flex;align-items:center;justify-content:center;position:relative;transition:background .15s,border-color .15s;cursor:pointer}
.slot.hov{background:var(--acc2);border-color:var(--acc)}
.slot.selectable{border-color:var(--acc);background:#f5f9ff}
.slot.filled{border-style:solid;border-color:transparent;background:transparent}
.slot.filled>.piece{width:100%;cursor:grab}
.slot.col{width:126px;min-height:92px}
.slot.bin{flex-wrap:wrap;align-content:flex-start;justify-content:flex-start;gap:6px;padding:8px;border-style:dashed!important;border-color:#a7b0be!important;background:rgba(249,250,251,.85)!important}
.slot.bin>.piece{width:auto}
.slot.bin.hov{background:var(--acc2)!important;border-color:var(--acc)!important}
.slot .ph{font-size:11px;color:var(--mut);font-weight:700;pointer-events:none}
.slot.ok>.piece{border-color:var(--ok);background:#f3fbf6}
.err-glow{animation:errGlow 1s ease-in-out 3;border-color:var(--ng)!important;box-shadow:0 0 0 3px rgba(229,56,59,.25),0 0 18px rgba(229,56,59,.55)!important}
.err-glow.slot{background:#fff5f5!important}
@keyframes errGlow{0%,100%{box-shadow:0 0 0 3px rgba(229,56,59,.25),0 0 6px rgba(229,56,59,.4)}50%{box-shadow:0 0 0 5px rgba(229,56,59,.35),0 0 24px rgba(229,56,59,.8)}}
.ok-glow{box-shadow:0 0 0 3px rgba(18,161,80,.25),0 0 16px rgba(18,161,80,.45)!important;border-color:var(--ok)!important}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.focus-ring{box-shadow:0 0 0 3px #111,0 0 0 6px rgba(17,17,17,.15)!important}

/* ---- エンジニアくん（エラー箇所の近くに出現） ---- */
.engpop{position:absolute;z-index:60;display:flex;gap:8px;align-items:flex-start;max-width:340px;animation:popIn .3s cubic-bezier(.2,1.4,.4,1);pointer-events:auto}
.engpop .av{width:46px;height:46px;flex:none;filter:drop-shadow(0 3px 6px rgba(0,0,0,.2))}
.engpop .bb{background:#fff;border:2px solid var(--ng);border-radius:4px 14px 14px 14px;padding:9px 12px 10px;font-size:13px;line-height:1.6;box-shadow:0 8px 24px rgba(0,0,0,.16);color:#3a1212}
.engpop .bb b.t{display:block;color:var(--ng);font-size:12px;margin-bottom:2px}
.engpop.info .bb{border-color:#111;color:#1b2230}.engpop.info .bb b.t{color:#111}
.engpop.ok .bb{border-color:var(--ok);color:#05603a}.engpop.ok .bb b.t{color:var(--ok)}
.engpop .x{position:absolute;right:-6px;top:-8px;width:20px;height:20px;border-radius:50%;background:#111;color:#fff;font-size:11px;display:flex;align-items:center;justify-content:center;cursor:pointer}
.engpop.flip{flex-direction:row-reverse}.engpop.flip .bb{border-radius:14px 4px 14px 14px}
@keyframes popIn{from{opacity:0;transform:scale(.7) translateY(8px)}to{opacity:1;transform:none}}

/* ---- 汎用フロー ---- */
.fnode{display:flex;align-items:center;gap:8px;background:#fff;border:1.5px solid #c9ced6;border-radius:10px;padding:8px 12px;font-size:13px;font-weight:700;min-height:42px}
.fnode .ic{font-size:18px}
.fnode.fixed{background:#f8f9fb}
.fnode.act,.slot.act{border-color:#111!important;box-shadow:0 0 0 3px rgba(17,17,17,.12),0 6px 16px rgba(0,0,0,.12);background:#fff}
.farrow{color:#b3bac5;font-size:14px;line-height:1;text-align:center}
.dsc{font-size:11px;color:var(--sub);font-weight:500;line-height:1.4}

/* ---- オーバーレイ・トースト ---- */
.toast{position:absolute;left:50%;top:70px;transform:translateX(-50%);background:#111;color:#fff;padding:10px 20px;border-radius:24px;font-weight:800;font-size:14px;z-index:80;animation:popIn .3s;box-shadow:0 8px 24px rgba(0,0,0,.3)}
.toast.ok{background:var(--ok)}
.cover{position:absolute;inset:0;z-index:90;background:rgba(255,255,255,.88);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;flex-direction:column;gap:14px;animation:fadeIn .4s}
.cover h2{margin:0;font-size:30px}
.cover p{margin:0;color:var(--sub)}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.fade-in{animation:fadeIn .4s}
.btn{background:#111;color:#fff;border:none;border-radius:10px;padding:9px 16px;font-weight:800;font-size:13px;cursor:pointer}
.btn.w{background:#fff;color:#111;border:1.5px solid #111}
.btn:disabled{opacity:.4;cursor:default}
.lines-svg{position:absolute;inset:0;pointer-events:none;z-index:20;overflow:visible}
.lines-svg path{fill:none;stroke:#111;stroke-width:2;stroke-dasharray:6 5;animation:dash 1s linear infinite}
@keyframes dash{to{stroke-dashoffset:-22}}

/* ===== スマホモックアップ ===== */
.mockwrap{display:flex;flex-direction:column;align-items:center;gap:8px}
.phone{position:relative;width:270px;height:556px;border-radius:44px;background:#0d0f12;padding:11px;box-shadow:0 0 0 2px #2b2f36,0 22px 50px rgba(16,24,40,.28),inset 0 0 0 1px #444}
.phone::before{content:"";position:absolute;right:-3px;top:120px;width:3px;height:64px;border-radius:2px;background:#2b2f36}
.phone::after{content:"";position:absolute;left:-3px;top:100px;width:3px;height:40px;border-radius:2px;background:#2b2f36;box-shadow:0 56px 0 #2b2f36}
.scr{position:relative;width:100%;height:100%;border-radius:34px;overflow:hidden;background:#fff;font-size:12px;color:#111}
.island{position:absolute;top:9px;left:50%;transform:translateX(-50%);width:84px;height:24px;border-radius:14px;background:#000;z-index:40}
.sbar{height:42px;display:flex;align-items:flex-end;justify-content:space-between;padding:0 22px 6px 26px;font-size:12px;font-weight:700;position:relative;z-index:5}
.sbar .r{display:flex;gap:4px;align-items:center;font-size:10px}
.sbar .bat{width:20px;height:10px;border:1.4px solid currentColor;border-radius:3px;position:relative}
.sbar .bat::after{content:"";position:absolute;inset:1.2px;right:4px;background:currentColor;border-radius:1px}
.view{position:absolute;top:42px;left:0;right:0;bottom:0;overflow:hidden}
.view>.screen{position:absolute;inset:0;overflow:hidden;animation:scrIn .35s ease}
@keyframes scrIn{from{opacity:0;transform:translateX(18px)}to{opacity:1;transform:none}}
.homebar{position:absolute;bottom:6px;left:50%;transform:translateX(-50%);width:96px;height:4px;border-radius:3px;background:#111;z-index:41;opacity:.8}
.finger{position:absolute;width:30px;height:30px;border-radius:50%;background:rgba(17,17,17,.28);border:2px solid rgba(255,255,255,.9);box-shadow:0 2px 8px rgba(0,0,0,.3);z-index:50;opacity:0;transition:left .4s cubic-bezier(.4,0,.2,1),top .4s cubic-bezier(.4,0,.2,1),opacity .2s,transform .12s;pointer-events:none;transform:translate(-50%,-50%)}
.finger.on{opacity:1}.finger.press{transform:translate(-50%,-50%) scale(.75)}
.ripple{position:absolute;width:12px;height:12px;border-radius:50%;border:2px solid #0a66d1;transform:translate(-50%,-50%);animation:rip .5s ease-out forwards;z-index:49;pointer-events:none}
@keyframes rip{to{width:60px;height:60px;opacity:0}}
.mhl{outline:3px solid #f5b400!important;outline-offset:2px;border-radius:6px;animation:mhl 1s ease-in-out infinite}
@keyframes mhl{50%{outline-color:rgba(245,180,0,.35)}}
.mhl-ng{outline:3px solid var(--ng)!important;outline-offset:2px;border-radius:6px;animation:none}
.movl{position:absolute;inset:0;z-index:45;pointer-events:none}
.mbadge{position:absolute;left:10px;right:10px;background:#111;color:#fff;border-radius:14px;padding:10px 12px;font-size:12px;font-weight:700;line-height:1.5;box-shadow:0 8px 20px rgba(0,0,0,.35);animation:popIn .3s;z-index:46}
.mbadge.ng{background:#d92d20}.mbadge.ok{background:#079455}.mbadge.w{background:#fff;color:#111;border:1px solid #ddd}
.phone-nav{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid var(--line);border-radius:22px;padding:4px 6px;box-shadow:var(--sh)}
.phone-nav button{width:30px;height:30px;border-radius:50%;border:none;background:#f2f4f7;font-size:16px;font-weight:900;cursor:pointer;color:#111}
.phone-nav button:disabled{opacity:.3;cursor:default}
.phone-nav .pnm{font-size:12px;font-weight:700;min-width:120px;text-align:center;color:#344054}
/* --- 端末内のWebサイト --- */
.s-home{background:linear-gradient(160deg,#5b8def 0%,#9b6bff 55%,#ff8fb1 100%);height:100%;padding:16px 18px;color:#fff}
.s-home .clock{text-align:center;font-size:44px;font-weight:300;margin:6px 0 2px}
.s-home .date{text-align:center;font-size:12px;opacity:.9;margin-bottom:22px}
.apps{display:grid;grid-template-columns:repeat(4,1fr);gap:16px 10px}
.app{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:9.5px}
.app i{width:46px;height:46px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-style:normal;font-size:24px;box-shadow:0 2px 6px rgba(0,0,0,.18)}
.dock{position:absolute;left:12px;right:12px;bottom:18px;height:68px;border-radius:24px;background:rgba(255,255,255,.28);backdrop-filter:blur(8px);display:flex;justify-content:space-around;align-items:center}
.brw{height:100%;display:flex;flex-direction:column;background:#fff}
.urlbar{margin:4px 10px 6px;height:30px;border-radius:10px;background:#eef0f3;display:flex;align-items:center;padding:0 10px;gap:6px;font-size:11.5px;color:#444}
.urlbar .lk{font-size:10px}
.sres{padding:4px 12px;overflow:hidden}
.sres .it{padding:8px 0;border-bottom:1px solid #eee}
.sres .u{font-size:9.5px;color:#137333}
.sres .t{font-size:13px;color:#1a0dab;font-weight:600;margin:1px 0}
.sres .d{font-size:9.5px;color:#555;line-height:1.4}
.sres .ad{font-size:9px;font-weight:800;color:#111;border:1px solid #111;border-radius:3px;padding:0 3px;margin-right:4px}
.shop{height:100%;display:flex;flex-direction:column;background:#fff;position:relative}
.shop-h{display:flex;align-items:center;gap:6px;padding:6px 12px;font-weight:900;font-size:15px;letter-spacing:.02em}
.shop-h .lg{width:24px;height:24px;border-radius:7px;background:#111;color:#fff;display:flex;align-items:center;justify-content:center;font-size:13px}
.shop-h .sp{flex:1}
.cartic{position:relative;font-size:18px;padding:2px}
.cartic b{position:absolute;right:-4px;top:-3px;background:#e5383b;color:#fff;font-size:9px;border-radius:8px;min-width:15px;height:15px;display:flex;align-items:center;justify-content:center;padding:0 3px}
.sbox{margin:2px 12px 8px;height:32px;border-radius:16px;border:1.5px solid #111;display:flex;align-items:center;padding:0 4px 0 12px;font-size:12px;gap:6px}
.sbox span{flex:1;color:#111}.sbox span:empty::before{content:"商品を検索";color:#aaa}
.sbox .go{width:26px;height:26px;border-radius:50%;background:#111;color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px}
.banner{margin:0 12px 10px;height:92px;border-radius:14px;background:linear-gradient(120deg,#ff7a59,#ffb347);color:#fff;padding:12px 14px;position:relative;overflow:hidden}
.banner b{font-size:17px;display:block}.banner small{font-size:10px;opacity:.95}
.banner .em{position:absolute;right:10px;bottom:2px;font-size:46px;transform:rotate(-8deg)}
.cats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding:0 12px 10px}
.cat{background:#f4f5f7;border-radius:12px;padding:8px 2px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:9.5px;font-weight:700}
.cat i{font-style:normal;font-size:20px}
.sec-t{font-weight:800;font-size:12px;padding:0 12px 6px;display:flex;justify-content:space-between}
.sec-t small{color:#888;font-weight:600}
.recs{display:flex;gap:8px;padding:0 12px}
.rec{flex:1;border-radius:12px;background:#fff;border:1px solid #eee;padding:6px;font-size:9.5px;font-weight:700}
.rec .im{height:52px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:28px;margin-bottom:3px}
.rbar{display:flex;align-items:center;justify-content:space-between;padding:0 12px 6px;font-size:10.5px;color:#666}
.pill{border:1px solid #ccc;border-radius:12px;padding:3px 9px;font-size:10px;font-weight:700;color:#111;background:#fff}
.plist{padding:0 12px;overflow:hidden}
.pitem{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid #f0f0f0}
.pitem .im{width:54px;height:54px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:30px;flex:none}
.pitem .nm{font-weight:800;font-size:13px}
.pitem .pr{font-weight:800;font-size:12px;margin-top:2px}
.pitem .st{font-size:9.5px;color:#079455;font-weight:700}.pitem .st.no{color:#d92d20}
.pitem .q{margin-left:auto;font-size:10.5px;color:#666;font-weight:700}
.dt{padding:0 14px;display:flex;flex-direction:column;gap:6px;height:100%}
.dt .back{font-size:11px;color:#666;font-weight:700}
.dt .im{height:190px;border-radius:18px;display:flex;align-items:center;justify-content:center;font-size:110px}
.dt .nm{font-size:20px;font-weight:900}
.dt .pr{font-size:18px;font-weight:900}.dt .pr small{font-size:10px;color:#888;font-weight:600}
.qty{display:flex;align-items:center;gap:10px;font-weight:800}
.qty span{font-size:11px;color:#666}
.qty .b{width:28px;height:28px;border-radius:50%;border:1.5px solid #111;display:flex;align-items:center;justify-content:center;font-size:15px}
.qty .n{font-size:16px;min-width:20px;text-align:center}
.mbtn{margin-top:auto;margin-bottom:28px;height:44px;border-radius:22px;background:#111;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;gap:6px}
.mbtn.sub{background:#fff;color:#111;border:1.5px solid #111;margin-bottom:8px}
.cartv{padding:0 14px;display:flex;flex-direction:column;height:100%}
.cartv h3{margin:2px 0 4px;font-size:16px}
.tot{display:flex;justify-content:space-between;align-items:baseline;font-weight:900;font-size:13px;padding:10px 2px;border-top:2px solid #111;margin-top:6px}
.tot b{font-size:20px}
.form{padding:0 14px;display:flex;flex-direction:column;gap:6px;height:100%}
.form h3{margin:2px 0 2px;font-size:16px}
.fl{font-size:10px;font-weight:800;color:#555}
.fi{height:30px;border-radius:9px;border:1.5px solid #ccc;padding:0 10px;display:flex;align-items:center;font-size:11.5px;color:#111}
.fi:empty::before{content:attr(data-ph);color:#bbb}
.pays{display:flex;gap:6px}.pays .pill.on{background:#111;color:#fff;border-color:#111}
.donev{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:0 20px;text-align:center}
.donev .ck{width:84px;height:84px;border-radius:50%;background:#111;color:#fff;font-size:44px;display:flex;align-items:center;justify-content:center;animation:popIn .5s}
.donev b{font-size:16px}
.err-scr{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;color:#555;text-align:center;padding:20px}
.err-scr .big{font-size:48px}
/* 画面レイアウトの崩し */
.th-font .shop-h,.th-font .nm{font-family:"Times New Roman",serif!important;font-style:italic}
.th-font .pr,.th-font .sec-t{font-family:"Courier New",monospace!important}
.th-font .banner b{font-family:fantasy,cursive!important}
.th-font .cat{font-family:cursive!important}
.th-size .pitem .nm{font-size:7px!important}.th-size .pitem .pr{font-size:21px!important}

/* ===== 段階型シナリオ（リスク → 対応） ===== */

/* 端末内のSNS・通知など */
.sns{height:100%;background:#fff;display:flex;flex-direction:column}

/* ===== ハブ（システム配置・ネットワーク構成図） ===== */

@keyframes hubp{0%,100%{box-shadow:0 0 0 0 rgba(10,102,209,.5)}50%{box-shadow:0 0 0 10px rgba(10,102,209,0)}}
.hubmk.cur{border-color:var(--acc)}.hubmk.cur .n{background:var(--acc)}
.hubmk.lock{opacity:.45;border-color:#c0c4ca;cursor:not-allowed;box-shadow:none}.hubmk.lock .n{background:#98a2b3}

.dg-box{position:absolute;background:#fff;border:2px solid #2b2f36;border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-weight:800;font-size:14px;box-shadow:var(--sh)}

/* ===== このページ固有のスタイル ===== */

.g3{display:grid;grid-template-columns:300px 1fr 440px;grid-template-rows:1fr 128px;height:711px}

/* 線形探索 */

<body>
<div id="pg"><main id="app">
<div class="g3">
  <div class="mk" id="mock"></div>
  <div class="sim" id="sim"></div>
  <div class="ws"><div class="hdr">🧱 ブロックプログラミング <div class="tabs" id="tabs"><span>①検索</span><span>②並び替え</span><span>③合計</span></div></div><div id="ws"></div></div>
  <div class="pal"><span class="tag">ブロック</span><div class="pool" id="pool"></div></div>
</div>
</main></div>
<script>
/* ===== 共通エンジン（ビルド時に各ページへインライン化） ===== */
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const h=html=>{const t=document.createElement('template');t.innerHTML=html.trim();return t.content.firstElementChild};
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const yen=n=>(Number(n)<0?'−¥':'¥')+Math.abs(Number(n)).toLocaleString();

/* ---------- 進捗（目次と共有） ---------- */
const Progress={
  KEY:'ec-dev-progress',LOCK:'ec-dev-lock',
  get(){try{return JSON.parse(localStorage.getItem(this.KEY))||{}}catch(e){return{}}},
  set(id){try{const p=this.get();p[id]=true;localStorage.setItem(this.KEY,JSON.stringify(p))}catch(e){}},
  locked(){try{return localStorage.getItem(this.LOCK)==='1'}catch(e){return false}}
};
function postParent(msg){try{if(window.parent&&window.parent!==window)window.parent.postMessage(msg,'*')}catch(e){}}

/* ---------- エンジニアくん（アバター） ---------- */
const ENG_SVG=`<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg"><circle cx="32" cy="32" r="31" fill="#111"/><path d="M12 64c2-12 10-17 20-17s18 5 20 17z" fill="#3b82f6"/><path d="M27 47h10l-5 7z" fill="#fff"/><circle cx="32" cy="30" r="14" fill="#ffd9b8"/><path d="M17 28c0-10 7-15 15-15s15 5 15 14c-3-4-8-6-12-6-6 0-11-1-14-4-1 4-2 8-4 11z" fill="#2b2118"/><rect x="21" y="27" width="9" height="7" rx="2.5" fill="none" stroke="#111" stroke-width="1.8"/><rect x="34" y="27" width="9" height="7" rx="2.5" fill="none" stroke="#111" stroke-width="1.8"/><path d="M30 30h4" stroke="#111" stroke-width="1.6"/><circle cx="25.5" cy="30.5" r="1.4" fill="#111"/><circle cx="38.5" cy="30.5" r="1.4" fill="#111"/><path d="M28 38q4 3 8 0" stroke="#b5552b" stroke-width="1.8" fill="none" stroke-linecap="round"/><path d="M15 30a17 17 0 0 1 34 0" stroke="#e5e7eb" stroke-width="3" fill="none"/><rect x="12" y="28" width="5" height="9" rx="2" fill="#e5e7eb"/><path d="M15 37q0 7 9 7" stroke="#e5e7eb" stroke-width="2" fill="none"/><circle cx="25" cy="44" r="2" fill="#e5e7eb"/></svg>`;

const STAGES={plan:['企画','--st-plan'],req:['要件定義','--st-req'],des:['設計','--st-des'],dev:['開発','--st-dev'],test:['テスト','--st-test'],ops:['管理運用','--st-ops']};

/* ---------- ページ枠 ---------- */
const Page={
  cfg:null,state:'check',
  init(cfg){
    this.cfg=cfg;const pg=$('#pg'),app=$('#app');const st=STAGES[cfg.stage]||['',''];
    pg.insertBefore(h(`<header id="hdr"><span class="chip" style="background:var(${st[1]})">${st[0]}</span><h1>${cfg.title}</h1><span class="mis">${cfg.mission||''}</span><div class="steps" id="steps"></div></header>`),app);
    pg.appendChild(h(`<footer id="ftr"><div class="eng-av">${ENG_SVG}</div><div class="eng-msg" id="engMsg"><span class="eng-name">エンジニアくん</span><span id="engTxt"></span></div><div class="sp"></div>${cfg.hints?'<button class="hintbtn" id="hintBtn">💡 ヒント</button>':''}<button id="checkBtn"><span id="cbTxt">${cfg.checkLabel||'答え合わせ'}</span></button></footer>`));
    $('#checkBtn').onclick=()=>this._click();
    if(cfg.hints){let hi=0;$('#hintBtn').onclick=()=>{Eng.say('💡 '+cfg.hints[hi%cfg.hints.length],'');hi++}}
    if(cfg.intro)Eng.say(cfg.intro);
    if(cfg.steps)this.setStep(0);
    postParent({type:'page-ready',id:cfg.id});
  },
  setStep(i){if(!this.cfg)return;const n=this.cfg.steps;if(!n)return;this.step=i;$('#steps').innerHTML=`STEP ${Math.min(i+1,n)}/${n} `+Array.from({length:n},(_,k)=>`<i class="${k<i?'done':k==i?'on':''}"></i>`).join('')},
  setLabel(t){$('#cbTxt').textContent=t},
  busy(b){$('#checkBtn').disabled=b},
  async _click(){
    if(this.state==='next'){postParent({type:'next',id:this.cfg.id});if(window.parent===window)Eng.say('（目次から開くと、次のファイルへ進みます）');return}
    if(this._running)return;this._running=true;this.busy(true);Eng.clear();Eng.say('🔍 確認しているよ…');
    let r=false;try{r=await this.cfg.onCheck()}catch(e){console.error(e)}
    this._running=false;this.busy(false);
    if(r===true)this.complete();
  },
  complete(msg){
    if(this.state==='next')return;this.state='next';
    if(this.cfg.steps)this.setStep(this.cfg.steps);
    Progress.set(this.cfg.id);postParent({type:'exercise-complete',id:this.cfg.id});
    const b=$('#checkBtn');b.classList.add('next');this.setLabel(this.cfg.nextLabel||'次へ進む ▶');
    Eng.say(msg||this.cfg.doneMsg||'完成！すべて正解だよ。右下の「次へ進む」で次の工程へ進もう。','ok');confetti();
  }
};

/* ---------- エンジニアくん（メッセージ・指摘） ---------- */
const Eng={
  say(t,type=''){const m=$('#engMsg');if(!m)return;$('#engTxt').innerHTML=t;m.className='eng-msg '+type;m.classList.remove('shake');void m.offsetWidth;if(type==='ng')m.classList.add('shake')},
  clear(){$$('.engpop').forEach(e=>e.remove());$$('.err-glow').forEach(e=>e.classList.remove('err-glow'))},
  point(el,text,{type='ng',title,keep=false,glow=true,below=false}={}){
    if(!keep)this.clear();if(!el)return;
    if(glow)el.classList.add('err-glow');
    const pg=$('#pg'),pr=pg.getBoundingClientRect(),r=el.getBoundingClientRect();
    const t=title||(type==='ng'?'ここが違うみたい！':type==='ok'?'いいね！':'エンジニアくん');
    const p=h(`<div class="engpop ${type==='ng'?'':type}"><div class="av">${ENG_SVG}</div><div class="bb"><b class="t">${t}</b>${text}</div><span class="x">✕</span></div>`);
    p.querySelector('.x').onclick=()=>p.remove();pg.appendChild(p);
    const k=pr.width/1440,R={left:(r.left-pr.left)/k,right:(r.right-pr.left)/k,top:(r.top-pr.top)/k,bottom:(r.bottom-pr.top)/k};
    const pw=p.offsetWidth,ph=p.offsetHeight;let x=R.right+10,y=R.top-6;
    if(below){x=Math.min(1430-pw,Math.max(8,R.left));y=R.bottom+8}
    else if(x+pw>1430){x=R.left-pw-10;p.classList.add('flip')}
    if(!below&&x<8){x=Math.max(8,Math.min(1430-pw,R.left));y=R.bottom+8;p.classList.remove('flip')}
    y=Math.max(60,Math.min(825-62-ph,y));p.style.left=x+'px';p.style.top=y+'px';
    this.say(text.replace(/<br>/g,' '),type==='ng'?'ng':type==='ok'?'ok':'');
    return p;
  },
  errors(list){/* list: [{el,msg}] */
    this.clear();if(!list.length)return;list.forEach(e=>e.el&&e.el.classList.add('err-glow'));
    const more=list.length>1?`<br><small style="color:#912018">ほかにも赤く光っているところが ${list.length-1} か所あるよ。</small>`:'';
    this.point(list[0].el,list[0].msg+more,{keep:true});
  }
};

/* ---------- パズル（ドラッグ＆ドロップ / クリック選択） ---------- */
class Puzzle{
  constructor({pieces,pool,order,root,onChange,pieceCls='',shuffle:sh=true,swap=false}){
    this.swap=swap;this.selSlot=null;this.defs=pieces;this.pool=pool;this.root=root||$('#app');this.onChange=onChange||(()=>{});this.pieceCls=pieceCls;
    this.order=order||Object.keys(pieces);if(sh)this.order=shuffle(this.order);
    this.map=new Map();this.sel=null;this.locked=false;
    $$('.slot',this.root).forEach(s=>{if(!s.dataset.ph0)s.dataset.ph0=s.innerHTML});
    this.renderPool();this._bind();
  }
  slots(){return $$('.slot',this.root).filter(s=>!s.closest('[data-off]'))}
  mk(id,extra=''){const d=this.defs[id];return h(`<div class="piece ${this.pieceCls} ${d.cls||''} ${extra}" data-pid="${id}">${d.icon?`<span class="ic">${d.icon}</span>`:''}<span class="lb">${d.label}</span></div>`)}
  renderPool(){if(!this.pool)return;this.pool.innerHTML='';const used=new Set([].concat(...this.map.values()));
    this.order.forEach(id=>{const p=this.mk(id);if(used.has(id)&&!this.defs[id].inf)p.classList.add('used');if(this.sel===id)p.classList.add('sel');this.pool.appendChild(p)})}
  renderSlot(s){const ids=this.map.get(s)||[];s.classList.remove('ok');
    if(!ids.length){s.innerHTML=s.dataset.ph0||'';s.classList.remove('filled');return}
    s.innerHTML='';ids.forEach(id=>{const p=this.mk(id);p.dataset.from='1';s.appendChild(p)});s.classList.add('filled')}
  get(s){return (this.map.get(s)||[])[0]}
  getAll(s){return this.map.get(s)||[]}
  put(s,id,{silent}={}){
    if(!this.defs[id].inf)for(const [k,v] of this.map){if(v.includes(id)){this.map.set(k,v.filter(x=>x!==id));this.renderSlot(k)}}
    const bin=s.classList.contains('bin');const cur=this.map.get(s)||[];
    this.map.set(s,bin?[...cur.filter(x=>x!==id),id]:[id]);this.renderSlot(s);
    s.classList.remove('err-glow');this.sel=null;this.renderPool();if(!silent)this.onChange(s,id);
  }
  swapSlots(a,b){const x=this.map.get(a)||[],y=this.map.get(b)||[];this.map.set(a,y);this.map.set(b,x);this.renderSlot(a);this.renderSlot(b);$$('.slot',this.root).forEach(z=>z.classList.remove('selectable','err-glow'));this.onChange(b,x[0])}
  remove(s,id){const v=(this.map.get(s)||[]).filter(x=>x!==id);this.map.set(s,v);this.renderSlot(s);this.renderPool();this.onChange(s,null)}
  reset(){this.map.clear();this.slots().forEach(s=>this.renderSlot(s));this.renderPool()}
  check(){const empty=[],wrong=[];
    this.slots().forEach(s=>{const acc=(s.dataset.accept||'').split('|');const ids=this.map.get(s)||[];
      if(s.classList.contains('bin')){if(ids.some(i=>!acc.includes(i)))wrong.push(s);else if(acc.some(a=>!ids.includes(a)))empty.push(s)}
      else if(!ids.length)empty.push(s);else if(!acc.includes(ids[0]))wrong.push(s)});
    return {ok:!empty.length&&!wrong.length,empty,wrong}}
  /* 標準の答え合わせ：エンジニアくんが指摘 */
  judge(){const r=this.check();
    if(r.ok){this.slots().forEach(s=>s.classList.add('ok'));return true}
    const list=[...r.wrong.map(s=>({el:s,msg:s.dataset.hint||'ここに入るカードを、もう一度考えてみよう。'})),...r.empty.map(s=>({el:s,msg:s.classList.contains('bin')?'まだ足りないカードがあるみたい。':'まだ空いているところがあるよ。カードを置いてみよう。'}))];
    Eng.errors(list);return false}
  lock(b=true){this.locked=b}
  _bind(){
    let st=null;
    const down=e=>{if(this.locked)return;const p=e.target.closest('.piece');if(!p||!p.dataset.pid||!(this.root.contains(p)||(this.pool&&this.pool.contains(p))))return;
      if(p.classList.contains('used'))return;e.preventDefault();
      st={p,id:p.dataset.pid,from:p.dataset.from?p.closest('.slot'):null,x:e.clientX,y:e.clientY,g:null}};
    const move=e=>{if(!st)return;const dx=e.clientX-st.x,dy=e.clientY-st.y;
      if(!st.g&&Math.hypot(dx,dy)>5){const r=st.p.getBoundingClientRect();st.g=st.p.cloneNode(true);st.g.classList.add('ghost');st.g.classList.remove('sel');st.g.style.width=r.width+'px';st.ox=e.clientX-r.left;st.oy=e.clientY-r.top;document.body.appendChild(st.g);st.p.style.opacity=.35}
      if(st.g){st.g.style.left=(e.clientX-st.ox)+'px';st.g.style.top=(e.clientY-st.oy)+'px';$$('.slot.hov').forEach(s=>s.classList.remove('hov'));const t=document.elementFromPoint(e.clientX,e.clientY);const s=t&&t.closest('.slot');if(s&&this.root.contains(s))s.classList.add('hov')}};
    const up=e=>{if(!st)return;const s0=st;st=null;$$('.slot.hov').forEach(s=>s.classList.remove('hov'));
      if(s0.g){s0.g.remove();s0.p.style.opacity='';const t=document.elementFromPoint(e.clientX,e.clientY);const s=t&&t.closest('.slot');
        if(s&&this.swap&&s0.from&&s!==s0.from){this.swapSlots(s0.from,s);return}
        if(s&&this.root.contains(s)&&!s.closest('[data-off]')){if(s0.from&&s0.from!==s&&this.defs[s0.id].inf){this.map.set(s0.from,(this.map.get(s0.from)||[]).filter(x=>x!==s0.id));this.renderSlot(s0.from)}this.put(s,s0.id)}
        else if(s0.from){this.remove(s0.from,s0.id)}
        return}
      /* クリック */
      if(s0.from&&this.swap){if(this.selSlot&&this.selSlot!==s0.from){const a=this.selSlot;this.selSlot=null;this.swapSlots(a,s0.from)}else{this.selSlot=this.selSlot===s0.from?null:s0.from;$$('.slot',this.root).forEach(x=>x.classList.toggle('selectable',x===this.selSlot))}return}
      if(s0.from){if(this.sel&&this.sel!==s0.id){this.put(s0.from,this.sel)}else this.remove(s0.from,s0.id);return}
      this.sel=this.sel===s0.id?null:s0.id;this.renderPool();this._mark()};
    document.addEventListener('pointerdown',down);document.addEventListener('pointermove',move);document.addEventListener('pointerup',up);
    this.root.addEventListener('click',e=>{if(this.locked||!this.sel)return;if(e.target.closest('.piece'))return;const s=e.target.closest('.slot');if(s&&!s.closest('[data-off]')){this.put(s,this.sel);this._mark()}});
  }
  _mark(){$$('.slot',this.root).forEach(s=>s.classList.toggle('selectable',!!this.sel&&!s.classList.contains('filled')))}
}

/* ---------- 段階型シナリオ：スマホで場面を再生 → リスク提示 → カードで対応 → 対応後のアニメ ---------- */
class Scenes{
  constructor({list,pieces,riskLabel='リスク',slotLabel='対応するカード',poolTitle='選択肢',histTitle='対応したこと'}){
    this.list=list;this.riskLabel=riskLabel;this.slotLabel=slotLabel;this.i=0;
    $('#app').innerHTML=`<div class="sc-grid"><div class="sc-mock" id="scMock"></div><div class="sc-mid"><div id="scCard"></div><div class="sc-ttl">${histTitle}</div><div class="sc-hist" id="scHist"></div></div><div class="sc-pool panel"><span class="tag" style="align-self:flex-start">${poolTitle}</span><div class="pool" id="scPool"></div></div></div>`;
    this.mock=new Mock($('#scMock'));
    this.P=new Puzzle({root:$('.sc-mid'),pool:$('#scPool'),pieces});
  }
  async start(){await this.show(0)}
  async show(i){const s=this.list[i];this.i=i;Page.setStep(i);
    $('#scCard').innerHTML=`<div class="panel sc-card"><div class="rk"><div class="ic">${s.icon||'⚠️'}</div><div><div class="lab">${this.riskLabel} ${i+1} / ${this.list.length}　${s.where?'｜ '+s.where:''}</div><h3>${s.title}</h3><p>${s.text}</p></div></div>
      <div class="ans"><b>${s.slotLabel||this.slotLabel} ▶</b><div class="slot" id="scSlot" data-accept="${s.accept.join('|')}" data-hint="${s.hint}" data-ph0='<span class="ph">ここにカードを置く</span>'><span class="ph">ここにカードを置く</span></div></div>
      <button class="rp" id="scReplay">▶ 場面をもう一度見る</button></div>`;
    $('#scReplay').onclick=()=>this.play();await this.play()}
  async play(){const s=this.list[this.i];this.P.lock(true);Page.busy(true);this.mock.clearBadges();
    try{await s.scene(this.mock)}catch(e){console.error(e)}
    this.mock.hideFinger();this.P.lock(false);Page.busy(false);Eng.say(s.ask||'スマホの中で問題が起きたね。どのカードで対応すればいいかな？')}
  async check(){const s=this.list[this.i],slot=$('#scSlot');const id=this.P.get(slot);
    if(!this.P.judge()){if(id&&s.ng)await s.ng(this.mock,id);return false}
    this.P.lock(true);this.mock.clearBadges();try{await s.fix(this.mock)}catch(e){console.error(e)}
    this.mock.hideFinger();
    $('#scHist').prepend(h(`<div class="hi"><span class="n">${this.i+1}</span><span class="r">${s.short||s.title}</span><span class="ar">➜</span><span class="a">${this.P.defs[id].label.replace(/<small>.*<\/small>/,'')}</span></div>`));
    Eng.say('✅ '+(s.ok||'解決！'),'ok');await sleep(1600);
    if(this.i<this.list.length-1){this.P.lock(false);await this.show(this.i+1);return false}
    return true}
}

/* ---------- ハブ：配置図の中の各タスクへ進む ---------- */
const Hub={
  init({subs,finale}){this.subs=subs;this.finale=finale;this.render();
    addEventListener('storage',()=>this.render());addEventListener('message',e=>{if(e.data&&e.data.type==='state')this.render()});
    document.addEventListener('click',e=>{const m=e.target.closest('.hubmk');if(!m)return;const i=+m.dataset.i,t=this.state()[i];if(!t.av){Eng.point(m,'前のタスクを先に終わらせよう。',{type:'info'});return}this.open(this.subs[i])})},
  state(){const p=Progress.get(),L=Progress.locked();let prevDone=true;
    return this.subs.map(s=>{const d=!!p[s.id];const av=!L||d||prevDone;const st={d,av,cur:!d&&prevDone};prevDone=prevDone&&d;return st})},
  render(){$$('.hubmk').forEach(e=>e.remove());const st=this.state();const pg=$('#pg');
    this.subs.forEach((s,i)=>{const t=st[i];const m=h(`<div class="hubmk ${t.d?'done':t.cur?'cur':''} ${t.av?'':'lock'}"><span class="n">${t.d?'✓':i+1}</span><span>${s.label}<small>${s.desc||''}</small></span><span class="go">${t.d?'もう一度':t.av?'開く ▶':'🔒'}</span></div>`);
      m.dataset.i=i;pg.appendChild(m);
      const r=relRect($(s.at));const pos=s.pos||'below';let x=r.cx-m.offsetWidth/2,y=r.y+r.h+10;
      if(pos==='above')y=r.y-m.offsetHeight-10;if(pos==='left'){x=r.x-m.offsetWidth-12;y=r.cy-m.offsetHeight/2}if(pos==='right'){x=r.x+r.w+12;y=r.cy-m.offsetHeight/2}if(pos==='in'){y=r.cy-m.offsetHeight/2}
      m.style.left=Math.max(8,x)+'px';m.style.top=y+'px';s._el=m});
    const nx=st.findIndex(t=>!t.d);this.allDone=nx<0;
    if(Page.state!=='next'){if(nx>=0){Page.setLabel('全体の動きを見る');Eng.point(this.subs[nx]._el,`次は <b>${this.subs[nx].label}</b> を見てみよう！ ボタンを押すと、くわしいページに進むよ。${this.subs[nx].say?'<br>'+this.subs[nx].say:''}`,{type:'info',title:`エンジニアくん（${nx+1}/${this.subs.length}）`,glow:false,below:true})}
      else{Eng.clear();Page.setLabel('▶ 全体の動きを見る');Eng.say('すべてのタスクが完了！ 右下のボタンで、全体がどう動くか確かめよう。','ok')}}
    Page.setStep(this.subs.filter((s,i)=>st[i].d).length)},
  open(s){if(window.parent!==window)postParent({type:'open',target:s.id});else location.href=s.file},
  async check(){const st=this.state();const nx=st.findIndex(t=>!t.d);
    if(nx>=0){Eng.point(this.subs[nx]._el,`まだ終わっていないタスクがあるよ。先に <b>${this.subs[nx].label}</b> をやってみよう。`,{title:'あと少し！'});return false}
    $$('.hubmk').forEach(e=>e.style.display='none');Eng.clear();await this.finale();return true}
};

 mission:'設計した処理を、ブロックでプログラムにしよう（線形探索・バブルソート・合計金額の計算）',
 intro:'いよいよ開発！ サーバーで動くプログラム（バックエンド）をつくるよ。まずは<b>商品検索</b>。右のプログラムの空いているところに、下のブロックを入れよう。',
 hints:['プログラムの3つの基本：順番に実行（順次）・くりかえし（反復）・もし〜なら（分岐）。','左の「やり方」の説明と、プログラムの行を見比べてみよう。'],
 async onCheck(){
  if(stage===0){const ok=await run1();if(!ok){P.judge();M.badge('⚠ 正しく検索できない…',{cls:'ng',top:200});setTimeout(()=>M.clearBadges(),1600);return false}
    P.judge();P.lock();stage=1;await sleep(500);go();Eng.say('検索できた！ 次は検索結果を<b>安い順</b>に並び替えよう。左のシミュレーターで、1回目の並び替え後の状態をつくって ▶ を押してね。','ok');return false}
  if(stage===1){if(pass<INIT.length-1){Eng.point($(`.bs-row[data-r="${pass}"] .cells`),'まだ並び替えが終わっていないよ。▶ で1回ずつ確かめながら進めよう。',{title:'あと少し！'});return false}
    stage=2;go();Eng.say('並び替え完了！ 最後は<b>合計金額</b>。関数・変数・配列・くりかえし・分岐をぜんぶ使うよ。','ok');return false}
  const ok=await run3();if(!ok){P.judge();return false}P.judge();P.lock();M.hideFinger();return true},
 doneMsg:'バックエンドのプログラムが完成！ 検索・並び替え・計算という“処理”が、ブロック（＝プログラム）で動いたね。'});

</script>
</body>
