<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EC-SHOP — システム開発エディター</title>
<style>
:root{--line:#e4e6ea;--sub:#6b7280;--sel:#e8f0fe;--acc:#0a66d1}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#fff;font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic UI",Meiryo,system-ui,sans-serif;color:#1f2328;-webkit-font-smoothing:antialiased;user-select:none}
#win{width:1440px;height:825px;display:grid;grid-template-rows:40px 1fr 24px;transform-origin:0 0;background:#fff}
/* タイトルバー */
#tb{display:flex;align-items:center;gap:14px;padding:0 14px;border-bottom:1px solid var(--line);background:#fbfbfc}
.dots{display:flex;gap:8px}.dots i{width:12px;height:12px;border-radius:50%;display:block}
.tbbtn{width:28px;height:24px;border-radius:6px;display:flex;align-items:center;justify-content:center;color:#444;font-size:12px}
.tbbtn:hover{background:#eef0f3}
#scheme{margin:0 auto;display:flex;align-items:center;gap:8px;background:#f1f3f5;border:1px solid var(--line);border-radius:8px;padding:4px 14px;font-size:12px;color:#333;min-width:420px;justify-content:center}
#scheme b{font-weight:700}
#prog{display:flex;align-items:center;gap:8px;font-size:12px;color:#333;font-weight:700}
#prog .bar{width:120px;height:6px;border-radius:4px;background:#e9ecef;overflow:hidden}#prog .bar i{display:block;height:100%;background:#16a34a;transition:width .5s}
/* 本体 */
#body{display:grid;grid-template-columns:46px 262px 1fr;min-height:0}
#act{border-right:1px solid var(--line);background:#fbfbfc;display:flex;flex-direction:column;align-items:center;padding-top:8px;gap:4px}
#act .a{width:34px;height:34px;border-radius:8px;display:flex;align-items:center;justify-content:center;color:#8a9099}
#act .a.on{color:#111;background:#eceef1}
#act svg{width:19px;height:19px}
#side{border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0;background:#fafbfc}
#side .sh{height:34px;display:flex;align-items:center;padding:0 14px;font-size:11px;font-weight:700;letter-spacing:.08em;color:#6b7280}
#side .proj{display:flex;align-items:center;gap:6px;padding:4px 10px 6px 12px;font-size:12px;font-weight:800;color:#111}
#tree{flex:1;overflow-y:auto;padding:0 6px 10px;font-size:13px}
.row{display:flex;align-items:center;gap:6px;height:26px;border-radius:6px;padding-right:8px;cursor:pointer;white-space:nowrap;position:relative}
.row:hover{background:#eef0f3}
.row .tw{width:14px;color:#8a9099;font-size:9px;text-align:center;transition:transform .15s;flex:none}
.row.open>.tw{transform:rotate(90deg)}
.row .ic{width:16px;height:16px;flex:none;display:flex}
.row .nm{overflow:hidden;text-overflow:ellipsis;flex:1}
.row .nm .ext{color:#9aa0a6}
.row.file.act{background:#dbe7fb}
.row.file.act .nm{font-weight:700}
.row.lock{opacity:.38;cursor:not-allowed}
.row.lock:hover{background:none}
.row .st{width:16px;height:16px;flex:none;display:flex;align-items:center;justify-content:center}
.row .st svg{width:15px;height:15px}
.row.flash{animation:flash 1.2s 2}
@keyframes flash{50%{background:#d1fadf}}
.row.shake{animation:sh .35s}
@keyframes sh{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.kids{overflow:hidden}
.kids.closed{display:none}
.fcount{font-size:10px;color:#9aa0a6;font-weight:700}
#side .foot{border-top:1px solid var(--line);padding:10px;display:flex;flex-direction:column;gap:6px;background:#fff}
#lockBtn{display:flex;align-items:center;gap:8px;width:100%;border:1px solid #d0d5dd;background:#fff;border-radius:8px;padding:8px 10px;font-size:12px;font-weight:700;cursor:pointer;color:#111;text-align:left}
#lockBtn .sw{margin-left:auto;width:32px;height:18px;border-radius:10px;background:#d0d5dd;position:relative;transition:background .2s;flex:none}
#lockBtn .sw::after{content:"";position:absolute;left:2px;top:2px;width:14px;height:14px;border-radius:50%;background:#fff;transition:left .2s;box-shadow:0 1px 2px rgba(0,0,0,.3)}
#lockBtn.on .sw{background:#111}#lockBtn.on .sw::after{left:16px}
#lockBtn small{display:block;font-weight:500;color:#6b7280;font-size:10px;margin-top:1px}
#resetBtn{border:none;background:none;color:#9aa0a6;font-size:11px;cursor:pointer;text-align:left;padding:0 2px}
#resetBtn:hover{color:#e5383b}
/* エディター */
#ed{display:flex;flex-direction:column;min-width:0;min-height:0;background:#fff}
#tabs{height:36px;display:flex;align-items:stretch;border-bottom:1px solid var(--line);background:#f7f8f9;overflow:hidden}
.tab{display:flex;align-items:center;gap:7px;padding:0 12px 0 14px;font-size:12px;border-right:1px solid var(--line);cursor:pointer;color:#555;max-width:220px;white-space:nowrap;position:relative}
.tab .ic{width:15px;height:15px;display:flex;flex:none}
.tab span{overflow:hidden;text-overflow:ellipsis}
.tab.on{background:#fff;color:#111;font-weight:700}
.tab.on::before{content:"";position:absolute;left:0;right:0;top:0;height:2px;background:#111}
.tab .x{width:18px;height:18px;border-radius:4px;display:flex;align-items:center;justify-content:center;color:#999;font-size:11px}
.tab .x:hover{background:#e4e6ea;color:#111}
#crumb{height:28px;display:flex;align-items:center;gap:6px;padding:0 14px;font-size:12px;color:#6b7280;border-bottom:1px solid var(--line)}
#crumb b{color:#111}
#crumb .sep{color:#c0c4ca}
#crumb .r{margin-left:auto;display:flex;gap:10px;align-items:center}
.pillst{font-size:11px;font-weight:700;border-radius:10px;padding:2px 9px;background:#f1f3f5;color:#555}
.pillst.done{background:#dcfce7;color:#166534}
#canvas{flex:1;position:relative;background:#eef0f3;background-image:radial-gradient(#d6d9de 1px,transparent 1px);background-size:14px 14px;min-height:0;overflow:hidden}
#frameBox{position:absolute;background:#fff;box-shadow:0 0 0 1px #d8dbe0,0 10px 30px rgba(16,24,40,.12);border-radius:8px;overflow:hidden}
#frameBox iframe{width:1440px;height:825px;border:none;transform-origin:0 0;display:block}
#welcome{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:#6b7280}
#welcome h2{margin:0;color:#111;font-size:26px}
#loader{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:rgba(255,255,255,.7);font-size:13px;color:#555;z-index:3}
/* ステータスバー */
#sb{display:flex;align-items:center;gap:16px;padding:0 12px;font-size:11.5px;color:#444;background:#f3f4f6;border-top:1px solid var(--line)}
#sb .r{margin-left:auto;display:flex;gap:16px}
#sbMsg{color:#166534;font-weight:700}
</style>
</head>
<body>
<div id="win">
  <div id="tb">
    <div class="dots"><i style="background:#ff5f57"></i><i style="background:#febc2e"></i><i style="background:#28c840"></i></div>
    <div class="tbbtn" title="サイドバー">▤</div><div class="tbbtn" title="実行">▶</div><div class="tbbtn" title="停止">■</div>
    <div id="scheme"><span>🛍</span><b>EC-SHOP</b><span style="color:#aaa">›</span><span>📱 iPhone 18 Pro</span><span style="color:#aaa">|</span><span id="schemeFile">ファイルを選択してください</span></div>
    <div id="prog"><span id="progTxt">0 / 0</span><div class="bar"><i id="progBar" style="width:0"></i></div></div>

  <div id="body">

      <div class="a on" title="エクスプローラー"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 4h7l2 2h7v13H4z"/></svg></div>

    </div>
    <aside id="side">
      <div class="sh">エクスプローラー</div>
      <div class="proj"><span style="font-size:10px;color:#8a9099">▼</span><span>EC-SHOP-PROJECT</span><span style="margin-left:auto" class="fcount" id="cnt"></span></div>
      <div id="tree"></div>
      <div class="foot">
        <button id="lockBtn"><span id="lockIc">🔓</span><span><span id="lockT">自由モード</span><small id="lockS">すべてのファイルを開けます</small></span><span class="sw"></span></button>
        <button id="resetBtn">↺ 進捗をリセット</button>
      </div>
    </aside>
    <section id="ed">
      <div id="tabs"></div>
      <div id="crumb"></div>
      <div id="canvas">
        <div id="welcome"><div style="font-size:46px">🛍</div><h2>ECサイトをつくろう</h2><div>左のエクスプローラーからファイルを開いてください</div></div>
        <div id="frameBox" style="display:none"><iframe id="fr" title="演習"></iframe><div id="loader">読み込み中…</div></div>
      </div>
    </section>
  </div>
  <div id="sb"><span>⎇ main</span><span id="sbLock">🔓 自由モード</span><span id="sbMsg"></span><div class="r"><span id="sbDone"></span><span>UTF-8</span><span>HTML</span><span>🔔</span></div></div>
</div>

<script>
/* ===== 目次データ（フォルダ = 工程、ファイル = 演習ページ） ===== */
const TREE=[
 {f:'企画',c:[
   {id:'01',n:'課題の確認',x:'md',file:'01-kadai.html'},
   {id:'02',n:'既存ECサイトのフローを可視化',x:'flow',file:'02-genjo-flow.html'},
   {id:'03',n:'理想の業務フローを可視化',x:'flow',file:'03-risou-flow.html'}]},
 {f:'要件定義',c:[
   {id:'04',n:'ステークホルダーへの聞き取り',x:'chat',file:'04-hearing.html'},
   {id:'05',n:'顧客の分析',x:'csv',file:'05-kokyaku.html'},
   {id:'06',n:'必要な機能の確認',x:'req',file:'06-kino.html'},
   {id:'07',n:'法律の確認',x:'law',file:'07-horitsu.html'},
   {id:'08',n:'個人情報保護の確認',x:'pii',file:'08-kojin-kakunin.html'},
   {id:'09',n:'個人情報保護対応',x:'pii',file:'09-kojin-taio.html'},
   {id:'10',n:'健康への影響調査',x:'md',file:'10-kenko.html'},
   {id:'11',n:'情報セキュリティリスク',x:'sec',file:'11-sec-risk.html'},
   {id:'12',n:'セキュリティ対応',x:'sec',file:'12-sec-taio.html'},
   {id:'13',n:'情報モラルの動向調査',x:'md',file:'13-moral.html'}]},
 {f:'設計',c:[
   {id:'14',n:'画面レイアウト',x:'ui',file:'14-layout.html'},
   {f:'システム配置',c:[
     {id:'15',n:'システム配置',x:'arch',file:'15-haichi.html',hub:true},
     {id:'16',n:'文字のデジタル化',x:'txt',file:'16-moji.html',sub:'15'},
     {id:'17',n:'画像のデジタル化',x:'img',file:'17-gazo.html',sub:'15'},
     {id:'18',n:'コンピュータの動作',x:'sys',file:'18-computer.html',sub:'15'},
     {id:'19',n:'論理回路',x:'circ',file:'19-ronri.html',sub:'15'}]},
   {f:'ネットワーク構成図',c:[
     {id:'20',n:'ネットワーク構成図',x:'net',file:'20-network.html',hub:true},
     {id:'21',n:'TCP/IP',x:'net',file:'21-tcpip.html',sub:'20'},
     {id:'22',n:'パケット交換方式',x:'net',file:'22-packet.html',sub:'20'},
     {id:'23',n:'暗号化',x:'key',file:'23-angou.html',sub:'20'},
     {id:'24',n:'接続の流れ',x:'dns',file:'24-setsuzoku.html',sub:'20'}]},
   {id:'25',n:'データベース設計',x:'db',file:'25-db.html'},
   {id:'26',n:'処理の流れ',x:'flow',file:'26-shori.html'}]},
 {f:'開発',c:[
   {id:'27',n:'バックエンド',x:'js',file:'27-backend.html'},
   {id:'28',n:'フロントエンド',x:'html',file:'28-frontend.html'}]},
 {f:'テスト',c:[{id:'29',n:'結合テスト',x:'test',file:'29-test.html'}]},
 {f:'管理運用',c:[{id:'30',n:'価格設定',x:'dash',file:'30-kakaku.html'}]}
];
const EXT_LABEL={md:'.md',flow:'.flow',chat:'.chat',csv:'.csv',req:'.req',law:'.law',pii:'.pii',sec:'.sec',ui:'.ui',arch:'.arch',txt:'.txt',img:'.png',sys:'.sys',circ:'.circuit',net:'.net',key:'.key',dns:'.dns',db:'.db',js:'.js',html:'.html',test:'.test',dash:'.dash'};

/* ===== アイコン ===== */
const I={
 folder:o=>`<svg viewBox="0 0 16 16"><path d="M1.5 3.5h4.2l1.4 1.4h7.4v8.6h-13z" fill="${o?'#9cc0f5':'#8fb5ef'}" stroke="#3f7fd8" stroke-width=".9"/>${o?'<path d="M1.5 6.5h13l-1.2 7h-11.8z" fill="#c4dafb" stroke="#3f7fd8" stroke-width=".9"/>':''}</svg>`,
 badge:(t,c)=>`<svg viewBox="0 0 16 16"><path d="M3 1.5h7l3 3v10H3z" fill="#fff" stroke="#b8bec7" stroke-width=".9"/><rect x="1" y="7.5" width="14" height="6.5" rx="1.6" fill="${c}"/><text x="8" y="12.6" text-anchor="middle" font-size="5.4" font-weight="800" fill="#fff" font-family="Arial">${t}</text></svg>`,
 db:`<svg viewBox="0 0 16 16"><ellipse cx="8" cy="3.5" rx="5.5" ry="2" fill="#7c8db5"/><path d="M2.5 3.5v9c0 1.1 2.5 2 5.5 2s5.5-.9 5.5-2v-9" fill="#9fb0d6" stroke="#5a6b94" stroke-width=".8"/><path d="M2.5 6.5c0 1.1 2.5 2 5.5 2s5.5-.9 5.5-2M2.5 9.5c0 1.1 2.5 2 5.5 2s5.5-.9 5.5-2" fill="none" stroke="#5a6b94" stroke-width=".8"/></svg>`,
 img:`<svg viewBox="0 0 16 16"><rect x="1.5" y="2.5" width="13" height="11" rx="1.5" fill="#e8f5e9" stroke="#2e9d57" stroke-width=".9"/><circle cx="5.5" cy="6" r="1.4" fill="#f5b400"/><path d="M2 12.5l4-4 3 3 2-2 3.5 3.5" fill="#2e9d57"/></svg>`,
 chat:`<svg viewBox="0 0 16 16"><path d="M2 3h12v8H7l-3 2.5V11H2z" fill="#16a34a"/><circle cx="5.5" cy="7" r=".9" fill="#fff"/><circle cx="8" cy="7" r=".9" fill="#fff"/><circle cx="10.5" cy="7" r=".9" fill="#fff"/></svg>`,
 key:`<svg viewBox="0 0 16 16"><circle cx="5" cy="8" r="3.3" fill="none" stroke="#d97706" stroke-width="2"/><path d="M8 8h6.5M12 8v2.5M14 8v2" stroke="#d97706" stroke-width="2"/></svg>`,
 net:`<svg viewBox="0 0 16 16"><circle cx="8" cy="8" r="6.3" fill="#e0ecff" stroke="#2563eb" stroke-width="1"/><path d="M1.7 8h12.6M8 1.7c-2.4 3.4-2.4 9.2 0 12.6M8 1.7c2.4 3.4 2.4 9.2 0 12.6" fill="none" stroke="#2563eb" stroke-width=".9"/></svg>`,
 sec:`<svg viewBox="0 0 16 16"><path d="M8 1.5l5.5 2v4.2c0 3.4-2.4 5.8-5.5 6.8-3.1-1-5.5-3.4-5.5-6.8V3.5z" fill="#fee2e2" stroke="#dc2626" stroke-width="1"/><path d="M5.5 8l1.8 1.8L10.8 6" fill="none" stroke="#dc2626" stroke-width="1.4"/></svg>`,
 law:`<svg viewBox="0 0 16 16"><path d="M8 2v11M4 13.5h8M3 4.5h10" stroke="#7c3aed" stroke-width="1.3"/><path d="M3 4.5L1.3 9h3.4zM13 4.5L11.3 9h3.4z" fill="#ddd6fe" stroke="#7c3aed" stroke-width=".9"/></svg>`,
 pii:`<svg viewBox="0 0 16 16"><rect x="1.5" y="3" width="13" height="10" rx="1.5" fill="#fdf2f8" stroke="#db2777" stroke-width=".9"/><circle cx="5.5" cy="7" r="1.6" fill="#db2777"/><path d="M3 11.2c.5-1.5 4.5-1.5 5 0" fill="#db2777"/><path d="M9.5 6.5h3.5M9.5 9h3.5" stroke="#db2777" stroke-width="1"/></svg>`,
 sys:`<svg viewBox="0 0 16 16"><rect x="4" y="4" width="8" height="8" rx="1" fill="#e0f2f1" stroke="#0e9384" stroke-width="1"/><rect x="6.2" y="6.2" width="3.6" height="3.6" fill="#0e9384"/><path d="M6 1.5v2.5M10 1.5v2.5M6 12v2.5M10 12v2.5M1.5 6H4M1.5 10H4M12 6h2.5M12 10h2.5" stroke="#0e9384" stroke-width="1"/></svg>`,
 circ:`<svg viewBox="0 0 16 16"><path d="M3 3.5h4.5a4.5 4.5 0 0 1 0 9H3z" fill="#fff7ed" stroke="#ea580c" stroke-width="1.1"/><path d="M0.5 6h2.5M0.5 10h2.5M12 8h3.5" stroke="#ea580c" stroke-width="1.1"/></svg>`,
 dash:`<svg viewBox="0 0 16 16"><rect x="1.5" y="1.5" width="13" height="13" rx="2" fill="#f0fdf4" stroke="#16a34a" stroke-width=".9"/><path d="M4 12V9M7 12V6M10 12V8M13 12V4" stroke="#16a34a" stroke-width="1.6"/></svg>`,
 test:`<svg viewBox="0 0 16 16"><path d="M6 1.5h4M6.5 1.5v4.5L2.5 13a1 1 0 0 0 .9 1.5h9.2a1 1 0 0 0 .9-1.5L9.5 6V1.5" fill="#fce7f3" stroke="#db2777" stroke-width=".9"/><path d="M4 11h8" stroke="#db2777" stroke-width="1"/></svg>`,
 dns:`<svg viewBox="0 0 16 16"><rect x="2" y="2" width="12" height="4" rx="1" fill="#e0e7ff" stroke="#4f46e5" stroke-width=".9"/><rect x="2" y="7.5" width="12" height="4" rx="1" fill="#e0e7ff" stroke="#4f46e5" stroke-width=".9"/><circle cx="4.3" cy="4" r=".8" fill="#4f46e5"/><circle cx="4.3" cy="9.5" r=".8" fill="#4f46e5"/><path d="M8 11.5v3M5 14.5h6" stroke="#4f46e5" stroke-width=".9"/></svg>`,
 arch:`<svg viewBox="0 0 16 16"><rect x="1" y="2" width="5" height="4" rx="1" fill="#ccfbf1" stroke="#0e9384" stroke-width=".9"/><rect x="10" y="2" width="5" height="4" rx="1" fill="#ccfbf1" stroke="#0e9384" stroke-width=".9"/><rect x="5.5" y="10" width="5" height="4" rx="1" fill="#0e9384"/><path d="M3.5 6v2h9V6M8 8v2" fill="none" stroke="#0e9384" stroke-width=".9"/></svg>`,
 ui:`<svg viewBox="0 0 16 16"><rect x="1.5" y="2" width="13" height="12" rx="1.5" fill="#fff" stroke="#0891b2" stroke-width="1"/><path d="M1.5 5h13M6 5v9" stroke="#0891b2" stroke-width="1"/><rect x="7.5" y="7" width="5.5" height="2" fill="#a5f3fc"/></svg>`
};
const BADGE={md:['MD','#3b82f6'],flow:['FL','#8b5cf6'],csv:['CSV','#16a34a'],req:['REQ','#f59e0b'],txt:['TXT','#64748b'],js:['JS','#d4a400'],html:['<>','#e2620c']};
function icon(x){return BADGE[x]?I.badge(...BADGE[x]):(I[x]||I.badge('?','#999'))}
const CHECK=`<svg viewBox="0 0 16 16"><circle cx="8" cy="8" r="7" fill="#16a34a"/><path d="M4.6 8.2l2.2 2.2 4.6-4.8" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
const LOCK=`<svg viewBox="0 0 16 16"><rect x="3.5" y="7" width="9" height="7" rx="1.5" fill="#9aa0a6"/><path d="M5.5 7V5a2.5 2.5 0 0 1 5 0v2" fill="none" stroke="#9aa0a6" stroke-width="1.5"/></svg>`;
const HUBDOT=`<svg viewBox="0 0 16 16"><circle cx="8" cy="8" r="4" fill="none" stroke="#0a66d1" stroke-width="1.6"/></svg>`;

/* ===== 状態 ===== */
const KEY='ec-dev-progress',LKEY='ec-dev-lock',TKEY='ec-dev-tabs';
const FILES={},FOLDERS=[];const DISPLAY=[];
(function walk(list,path,parent){list.forEach(n=>{if(n.f){FOLDERS.push(n);n.path=[...path,n.f];walk(n.c,n.path,n)}else{n.path=path;FILES[n.id]=n;DISPLAY.push(n.id)}})})(TREE,[],null);
const HUBS={};DISPLAY.forEach(id=>{const f=FILES[id];if(f.sub)(HUBS[f.sub]=HUBS[f.sub]||[]).push(id)});
/* 完了の順番：ハブ（システム配置・ネットワーク構成図）は、その中のファイルがすべて終わった後に完了する */
const ORDER=[];DISPLAY.forEach(id=>{const f=FILES[id];if(f.hub)return;ORDER.push(id);if(f.sub&&HUBS[f.sub][HUBS[f.sub].length-1]===id)ORDER.push(f.sub)});
const load=()=>{try{return JSON.parse(localStorage.getItem(KEY))||{}}catch(e){return{}}};
const save=p=>{try{localStorage.setItem(KEY,JSON.stringify(p))}catch(e){}};
let done=load(),locked=false,cur=null,tabs=[];
try{locked=localStorage.getItem(LKEY)==='1';tabs=JSON.parse(localStorage.getItem(TKEY))||[]}catch(e){}
const openFolders=new Set(FOLDERS.map(f=>f.path.join('/')));

function unlocked(id){
  if(!locked||done[id])return true;
  const f=FILES[id];if(f.hub)return unlocked(HUBS[id][0]);
  const i=ORDER.indexOf(id);return ORDER.slice(0,i).every(x=>done[x]);
}

/* ===== ツリー描画 ===== */
function renderTree(){
  const box=document.getElementById('tree');box.innerHTML='';
  (function draw(list,depth,host){list.forEach(n=>{
    if(n.f){const key=n.path.join('/');const op=openFolders.has(key);
      const ids=[];(function g(l){l.forEach(x=>x.f?g(x.c):ids.push(x.id))})(n.c);const dn=ids.filter(i=>done[i]).length;
      const r=el(`<div class="row folder ${op?'open':''}" style="padding-left:${4+depth*14}px"><span class="tw">▶</span><span class="ic">${I.folder(op)}</span><span class="nm">${n.f}</span><span class="fcount">${dn}/${ids.length}</span></div>`);
      r.onclick=()=>{op?openFolders.delete(key):openFolders.add(key);renderTree()};host.appendChild(r);
      const k=el(`<div class="kids ${op?'':'closed'}"></div>`);host.appendChild(k);draw(n.c,depth+1,k);
    }else{const u=unlocked(n.id);
      const r=el(`<div class="row file ${cur===n.id?'act':''} ${u?'':'lock'}" data-id="${n.id}" style="padding-left:${18+depth*14}px" title="${n.n}${EXT_LABEL[n.x]}${u?'':'（前のタスクを完了すると開けます）'}"><span class="ic">${icon(n.x)}</span><span class="nm">${n.n}<span class="ext">${EXT_LABEL[n.x]}</span></span><span class="st">${done[n.id]?CHECK:u?(n.hub?HUBDOT:''):LOCK}</span></div>`);
      r.onclick=()=>open(n.id);host.appendChild(r)}
  })})(TREE,0,box);
  const total=DISPLAY.length,dn=DISPLAY.filter(i=>done[i]).length;
  document.getElementById('progTxt').textContent=`完了 ${dn} / ${total}`;document.getElementById('progBar').style.width=(dn/total*100)+'%';
  document.getElementById('sbDone').textContent=`✓ ${dn}/${total} タスク完了`;document.getElementById('cnt').textContent=`${total} files`;
  renderTabs();renderCrumb();
}
function el(s){const t=document.createElement('template');t.innerHTML=s.trim();return t.content.firstElementChild}

function renderTabs(){const t=document.getElementById('tabs');t.innerHTML='';
  tabs.forEach(id=>{const f=FILES[id];if(!f)return;const e=el(`<div class="tab ${id===cur?'on':''}"><span class="ic">${icon(f.x)}</span><span>${f.n}${EXT_LABEL[f.x]}</span><span class="x">✕</span></div>`);
    e.onclick=ev=>{if(ev.target.classList.contains('x')){tabs=tabs.filter(x=>x!==id);saveTabs();if(id===cur){tabs.length?open(tabs[tabs.length-1]):close()}else renderTabs();ev.stopPropagation();return}open(id)};t.appendChild(e)})}
function saveTabs(){try{localStorage.setItem(TKEY,JSON.stringify(tabs))}catch(e){}}
function renderCrumb(){const c=document.getElementById('crumb');if(!cur){c.innerHTML='<span>EC-SHOP-PROJECT</span>';return}const f=FILES[cur];
  c.innerHTML=`<span>EC-SHOP-PROJECT</span>${f.path.map(p=>`<span class="sep">›</span><span>${p}</span>`).join('')}<span class="sep">›</span><span class="ic" style="width:14px;height:14px;display:flex">${icon(f.x)}</span><b>${f.n}${EXT_LABEL[f.x]}</b><div class="r"><span class="pillst ${done[cur]?'done':''}">${done[cur]?'✓ 完了':'未完了'}</span></div>`;
  document.getElementById('schemeFile').textContent=f.n+EXT_LABEL[f.x]}

/* ===== ファイルを開く ===== */
function open(id){const f=FILES[id];if(!f)return;
  if(!unlocked(id)){const r=document.querySelector(`.row[data-id="${id}"]`);if(r){r.classList.remove('shake');void r.offsetWidth;r.classList.add('shake')}flash('🔒 前のタスクを完了すると開けます',true);return}
  f.path.forEach((p,i)=>openFolders.add(f.path.slice(0,i+1).join('/')));
  cur=id;if(!tabs.includes(id)){tabs.push(id);if(tabs.length>6)tabs.shift();saveTabs()}
  document.getElementById('welcome').style.display='none';document.getElementById('frameBox').style.display='block';
  const ld=document.getElementById('loader');ld.style.display='flex';const fr=document.getElementById('fr');fr.onload=()=>{ld.style.display='none'};fr.src=f.file;
  try{history.replaceState(null,'','#'+id)}catch(e){}
  renderTree();fit();
}
function close(){cur=null;document.getElementById('fr').src='about:blank';document.getElementById('frameBox').style.display='none';document.getElementById('welcome').style.display='flex';renderTree()}
function nextOf(id){const f=FILES[id];if(f.sub)return f.sub;
  const i=DISPLAY.indexOf(id);for(let k=i+1;k<DISPLAY.length;k++){const n=FILES[DISPLAY[k]];if(!n.sub)return n.id}return null}

let flashT;function flash(t,bad){const m=document.getElementById('sbMsg');m.textContent=t;m.style.color=bad?'#b42318':'#166534';clearTimeout(flashT);flashT=setTimeout(()=>m.textContent='',4000)}

/* ===== 演習ページ（iframe）からの通知 ===== */
window.addEventListener('message',e=>{const d=e.data;if(!d||!d.type)return;
  const fr=document.getElementById('fr');if(e.source!==fr.contentWindow)return;
  const id=d.id||cur;
  if(d.type==='exercise-complete'){done=load();done[id]=true;save(done);renderTree();
    const r=document.querySelector(`.row[data-id="${id}"]`);if(r)r.classList.add('flash');
    const nx=nextOf(id);flash(`✓ ${FILES[id].n} 完了${nx&&locked?' — 次のファイルが解放されました':''}`)}
  if(d.type==='next'){const nx=nextOf(id);if(nx)open(nx);else flash('🎉 すべての工程が完了しました！')}
  if(d.type==='open'&&d.target){open(d.target)}
});

/* ===== ロック（順番モード） ===== */
function renderLock(){const b=document.getElementById('lockBtn');b.classList.toggle('on',locked);
  document.getElementById('lockIc').textContent=locked?'🔒':'🔓';document.getElementById('lockT').textContent=locked?'順番モード':'自由モード';
  document.getElementById('lockS').textContent=locked?'完了すると次のファイルが開きます':'すべてのファイルを開けます';
  document.getElementById('sbLock').textContent=locked?'🔒 順番モード':'🔓 自由モード'}
document.getElementById('lockBtn').onclick=()=>{locked=!locked;try{localStorage.setItem(LKEY,locked?'1':'0')}catch(e){}renderLock();renderTree();
  const f=cur&&FILES[cur];if(f&&f.hub)document.getElementById('fr').contentWindow.postMessage({type:'state'},'*')};
document.getElementById('resetBtn').onclick=()=>{if(!confirm('すべての完了状態をリセットしますか？'))return;done={};save(done);renderTree();if(cur)open(cur)};

/* ===== 画面サイズに合わせて拡大縮小 ===== */
function fit(){
  const w=document.getElementById('win');const s=Math.min(innerWidth/1440,innerHeight/825);w.style.transform=`scale(${s})`;
  const cv=document.getElementById('canvas'),fb=document.getElementById('frameBox'),fr=document.getElementById('fr');
  const cw=cv.offsetWidth-24,ch=cv.offsetHeight-24;const k=Math.min(cw/1440,ch/825);
  fb.style.width=1440*k+'px';fb.style.height=825*k+'px';fb.style.left=(cv.offsetWidth-1440*k)/2+'px';fb.style.top=(cv.offsetHeight-825*k)/2+'px';fr.style.transform=`scale(${k})`;
}
addEventListener('resize',fit);
window.addEventListener('storage',()=>{done=load();renderTree()});
renderLock();renderTree();fit();
const h0=location.hash.slice(1);if(FILES[h0]&&unlocked(h0))open(h0);else if(tabs.length&&unlocked(tabs[tabs.length-1]))open(tabs[tabs.length-1]);
</script>
</body>
</html>
